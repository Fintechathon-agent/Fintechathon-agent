# Reference profile only. DO NOT deploy until workspace, secrets, access and
# a user-authorized budget have been configured and acceptance has passed.
# Copy to the ignored wrangler.bailian.local.toml when preparing a switch.
name = "personal-ai-fund-manager-core-agent"
main = "deployment/worker.js"
compatibility_date = "2026-10-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
MODEL_PROVIDER = "aliyun_bailian"
MODEL_NAME = "qwen3.8-flash"
MODEL_API_STYLE = "chat_completions"
MODEL_RESPONSE_FORMAT = "json_object"
MODEL_TIMEOUT_MS = "30000"
MODEL_MAX_ATTEMPTS = "2"
MODEL_REQUESTS_PER_MINUTE = "6"
MODEL_DISABLE_RULE_FALLBACK = "true"
MODEL_FALLBACK_TO_RULES = "false"
BAILIAN_REGION = "cn-beijing"
BAILIAN_WORKSPACE_ID = ""
BAILIAN_ALLOW_PAID_CALLS = "false"
BAILIAN_TEST_BUDGET_CNY = "0"
BAILIAN_DAILY_BUDGET_CNY = "0"
BAILIAN_MAX_OUTPUT_TOKENS = "1600"
REQUIRE_TRUSTED_ACTORS = "true"
RATE_LIMIT_PER_MINUTE = "60"
CORS_ORIGINS = "https://realchenchenluo.github.io"

# DASHSCOPE_API_KEY and CORE_AGENT_API_KEY must be encrypted backend secrets.
# Keep the existing binding available for a deliberate rollback.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "REVIEW_SERVICE"
class_name = "ReviewService"

[[migrations]]
tag = "review-service-v1"
new_sqlite_classes = ["ReviewService"]
