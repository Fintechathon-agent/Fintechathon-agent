<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f3"><title>Personal AI Fund Manager</title><link rel="stylesheet" href="/personal-fund/health.css"><script type="module" src="/personal-fund/integration.js"></script></head>
<body><a class="skip" href="#question">跳到输入框</a>
<aside id="sidebar" aria-label="对话与持仓记录"><div class="side-head"><span class="brand-icon">◈</span><strong>Personal AI<br>Fund Manager</strong><button id="close-sidebar" aria-label="收起历史">×</button></div><button id="new-chat" class="new-chat"><span>＋</span> 新对话</button><p class="history-label">最近对话</p><nav id="history" aria-label="对话历史"></nav><details id="saved-section" class="saved-section"><summary>演示说明</summary><p class="scope-note">账单、转账和理财共用当前浏览器访客的 Finance 演示后端；Core/Risk 正式联合接线仍待验收。</p></details><div class="side-foot">本机隔离演示会话<br><span>虚构数据 · 不跨设备同步</span></div></aside>
<div id="shade" hidden></div>
<main><header><button id="menu" aria-label="打开历史会话" aria-controls="sidebar" aria-expanded="false">☰</button><a href="/">Personal AI Fund Manager</a><span class="header-note">核对 · 记录 · 比较</span></header>
<div id="scroll-area"><section id="welcome"><div class="welcome-mark">◈</div><p class="eyebrow">一个入口，完成银行任务</p><h1>说出你的需求，<br>逐步核对结果与风险</h1><p>从账单、转账或理财开始。页面展示后端计算与审批状态，所有资金操作均为演示模拟。</p><div id="examples"><button data-example="bill"><span class="example-label">账单分析</span>这个月账单分析</button><button data-example="transfer"><span class="example-label">模拟转账</span>给张伟转700元备注房租</button><button data-example="investment"><span class="example-label">理财诊断</span>帮我看看持仓是否太集中</button></div></section><section id="messages" aria-label="当前对话"></section><section id="current-review" aria-label="当前任务详情" hidden></section><div id="bottom-anchor"></div></div>
<div class="composer-wrap"><button id="to-bottom" hidden>↓ 回到最新消息</button><div id="notice" role="alert" hidden></div><form id="composer"><label class="sr-only" for="question">发送消息</label><textarea id="question" rows="2" maxlength="2000" placeholder="输入账单、转账或理财需求…"></textarea><div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" aria-label="发送消息">↑</button><button id="stop" type="button" hidden>■ 停止</button></div></form><p class="footer-note">本机候选版 · 仅用虚构数据和模拟回执，不连接真实账户。</p></div>
</main>
<dialog id="record-dialog" aria-labelledby="record-title"><div class="dialog-heading"><h2 id="record-title">持仓记录</h2><button id="close-record" aria-label="关闭持仓记录">×</button></div><div id="record-content"></div><div id="record-notice" role="status"></div></dialog>
</body></html>
